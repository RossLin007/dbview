name: dbview

services:
  # 后端 API 服务容器 (Express + Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbview-backend
    restart: always
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-${PORT:-3301}}:3301"
    networks:
      - dbview-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3301/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 前端网页服务容器 (Vite + Nginx 反向代理)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dbview-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-7880}:7880"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dbview-network

networks:
  dbview-network:
    driver: bridge
