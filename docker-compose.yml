name: dbview

services:
  # 后端 API 服务容器 (Express + Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dbview-backend
    restart: always
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-${PORT:-3001}}:3001"
    networks:
      - dbview-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 前端网页服务容器 (Vite + Nginx 反向代理)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dbview-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dbview-network

networks:
  dbview-network:
    driver: bridge
